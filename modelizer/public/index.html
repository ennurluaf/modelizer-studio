<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelizer Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/app.css">
  <!-- Shared with the Node backend (UMD modules) -->
  <script src="/shared/NamingConvention.js"></script>
  <script src="/shared/LinkNameSuggester.js"></script>
  <script src="/shared/ModelValidator.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <i class="fa-solid fa-diagram-project brand__mark" aria-hidden="true"></i>
        <input class="brand__name" id="doc-name" type="text" spellcheck="false" aria-label="Model name" value="Untitled model">
      </div>

      <nav class="menus" aria-label="Main menu">
        <div class="menu">
          <button class="menu__trigger" type="button" aria-haspopup="true"><i class="fa-regular fa-folder"></i> File</button>
          <div class="menu__panel" role="menu">
            <button type="button" data-command="newDocument"><i class="fa-regular fa-file"></i> New model</button>
            <button type="button" data-command="openLibrary"><i class="fa-solid fa-server"></i> Open from server…</button>
            <button type="button" data-command="save"><i class="fa-regular fa-floppy-disk"></i> Save to server</button>
            <hr>
            <button type="button" data-command="import"><i class="fa-solid fa-file-import"></i> Import JSON…</button>
            <button type="button" data-command="exportJson"><i class="fa-solid fa-file-export"></i> Export JSON</button>
            <button type="button" data-command="exportSql"><i class="fa-solid fa-database"></i> Export SQL (from PDM)</button>
            <hr>
            <button type="button" data-command="print"><i class="fa-solid fa-print"></i> Print or save as PDF…</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu__trigger" type="button" aria-haspopup="true"><i class="fa-solid fa-shuffle"></i> Transform</button>
          <div class="menu__panel" role="menu">
            <button type="button" data-command="cdmToLdm"><i class="fa-solid fa-arrow-right"></i> Generate LDM from CDM</button>
            <button type="button" data-command="ldmToPdm"><i class="fa-solid fa-arrow-right"></i> Generate PDM from LDM</button>
            <button type="button" data-command="cdmToPdm"><i class="fa-solid fa-forward"></i> Generate LDM and PDM from CDM</button>
            <hr>
            <button type="button" data-command="pdmToLdm"><i class="fa-solid fa-arrow-left"></i> Rebuild LDM from PDM</button>
            <button type="button" data-command="ldmToCdm"><i class="fa-solid fa-arrow-left"></i> Rebuild CDM from LDM</button>
            <button type="button" data-command="pdmToCdm"><i class="fa-solid fa-backward"></i> Rebuild CDM and LDM from PDM</button>
            <hr>
            <button type="button" data-command="loadSample"><i class="fa-solid fa-dumbbell"></i> Load ProTraining360 sample</button>
          </div>
        </div>
      </nav>

      <div class="pipeline" role="tablist" aria-label="Data models">
        <button class="pipeline__tab" type="button" role="tab" data-model="cdm" data-command="tabCdm" aria-label="Conceptual data model">
          <span class="pipeline__code">CDM</span><span class="pipeline__label">Conceptual</span>
        </button>
        <div class="pipeline__bridge">
          <button type="button" data-command="cdmToLdm" aria-label="Generate LDM from CDM"><i class="fa-solid fa-angle-right"></i></button>
          <button type="button" data-command="ldmToCdm" aria-label="Rebuild CDM from LDM"><i class="fa-solid fa-angle-left"></i></button>
        </div>
        <button class="pipeline__tab" type="button" role="tab" data-model="ldm" data-command="tabLdm" aria-label="Logical data model">
          <span class="pipeline__code">LDM</span><span class="pipeline__label">Logical</span>
        </button>
        <div class="pipeline__bridge">
          <button type="button" data-command="ldmToPdm" aria-label="Generate PDM from LDM"><i class="fa-solid fa-angle-right"></i></button>
          <button type="button" data-command="pdmToLdm" aria-label="Rebuild LDM from PDM"><i class="fa-solid fa-angle-left"></i></button>
        </div>
        <button class="pipeline__tab" type="button" role="tab" data-model="pdm" data-command="tabPdm" aria-label="Physical data model">
          <span class="pipeline__code">PDM</span><span class="pipeline__label">Physical</span>
        </button>
      </div>

      <div class="topbar__actions">
        <button class="icon-btn" type="button" data-command="undo" aria-label="Undo"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="icon-btn" type="button" data-command="redo" aria-label="Redo"><i class="fa-solid fa-rotate-right"></i></button>
        <span class="topbar__sep"></span>
        <button class="icon-btn" type="button" data-command="print" aria-label="Print"><i class="fa-solid fa-print"></i></button>
        <button class="icon-btn" type="button" data-command="save" aria-label="Save to server"><i class="fa-regular fa-floppy-disk"></i></button>
        <button class="icon-btn" type="button" data-command="settings" aria-label="Settings"><i class="fa-solid fa-sliders"></i></button>
      </div>
    </header>

    <aside class="rail" aria-label="Tools">
      <button class="rail__btn" type="button" data-command="toolSelect" data-tool="select" aria-label="Select"><i class="fa-solid fa-arrow-pointer"></i></button>
      <button class="rail__btn" type="button" data-command="linkTool" data-tool="link" aria-label="Link tables"><i class="fa-solid fa-link"></i></button>
      <span class="rail__sep"></span>
      <button class="rail__btn" type="button" data-command="addNode" aria-label="Add table"><i class="fa-solid fa-table-cells-large"></i></button>
      <button class="rail__btn" type="button" data-command="addRow" aria-label="Add field"><i class="fa-solid fa-list-ul"></i></button>
      <button class="rail__btn" type="button" data-command="duplicate" aria-label="Duplicate"><i class="fa-regular fa-clone"></i></button>
      <button class="rail__btn rail__btn--danger" type="button" data-command="delete" aria-label="Delete"><i class="fa-regular fa-trash-can"></i></button>
      <span class="rail__sep"></span>
      <button class="rail__btn" type="button" data-command="fit" aria-label="Fit diagram"><i class="fa-solid fa-expand"></i></button>
      <button class="rail__btn" type="button" data-command="toggleIssues" aria-label="Naming issues"><i class="fa-solid fa-spell-check"></i></button>
    </aside>

    <main class="stage" id="stage">
      <div class="canvas" id="canvas" tabindex="0" aria-label="Diagram canvas">
        <div class="world" id="world"></div>
        <div class="marquee" id="marquee" hidden></div>
        <div class="empty" id="empty" hidden>
          <p class="empty__title">This model is empty</p>
          <p class="empty__text" id="empty-text">Double-click the canvas to add a class.</p>
          <div class="empty__actions">
            <button class="btn btn--primary" type="button" data-command="addNode"><i class="fa-solid fa-plus"></i> Add a table</button>
            <button class="btn" type="button" data-command="import"><i class="fa-solid fa-file-import"></i> Import JSON</button>
            <button class="btn" type="button" data-command="loadSample"><i class="fa-solid fa-dumbbell"></i> Load sample</button>
          </div>
        </div>
        <div class="tool-hint" id="tool-hint" hidden></div>
      </div>

      <section class="issues" id="issues" hidden aria-label="Naming issues">
        <header class="issues__head">
          <strong>Naming convention</strong>
          <div class="seg" id="issues-scope">
            <button type="button" data-scope="model" class="is-active">This model</button>
            <button type="button" data-scope="all">All models</button>
          </div>
          <button class="icon-btn" type="button" data-command="toggleIssues" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <ul class="issues__list" id="issues-list"></ul>
      </section>
    </main>

    <aside class="inspector" id="inspector" aria-label="Properties"></aside>

    <footer class="statusbar">
      <span id="status-selection">Nothing selected</span>
      <button class="status-issues" type="button" id="status-issues" data-command="toggleIssues"></button>
      <span class="statusbar__spacer"></span>
      <span class="status-saved" id="status-saved"></span>
      <div class="zoom" aria-label="Diagram zoom">
        <button class="icon-btn" type="button" data-command="zoomOut" aria-label="Zoom out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <input type="range" id="zoom-range" min="20" max="300" step="5" value="100" aria-label="Diagram zoom">
        <button class="zoom__value" type="button" id="zoom-value" data-command="zoomReset">100%</button>
        <button class="icon-btn" type="button" data-command="zoomIn" aria-label="Zoom in"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      </div>
      <div class="zoom zoom--ui" aria-label="Interface zoom">
        <i class="fa-solid fa-text-height" aria-hidden="true"></i>
        <button class="icon-btn" type="button" data-command="uiZoomOut" aria-label="Smaller interface"><i class="fa-solid fa-minus"></i></button>
        <button class="zoom__value" type="button" id="ui-zoom-value" data-command="uiZoomReset">100%</button>
        <button class="icon-btn" type="button" data-command="uiZoomIn" aria-label="Larger interface"><i class="fa-solid fa-plus"></i></button>
      </div>
    </footer>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
